<html>
  <head>
    <meta charset="utf-8" />
    <title>Hello OpenCV.js</title>
  </head>
  <body>
    <h2>Hello OpenCV.js</h2>
    <p id="status"></p>
    <div>
      <table cellpadding="0" cellspacing="0" width="0" border="0">
        <tbody>
          <tr>
            <td>
              <img id="imageSrc" alt="No Image" class="small" src="" />
            </td>
            <td>
              <canvas id="canvasOutput" class="small" height="300px"></canvas>
            </td>
          </tr>
          <tr>
            <td>
              <div class="caption">
                imageSrc
                <input
                  type="file"
                  id="fileInput"
                  name="file"
                  accept="image/*"
                />
              </div>
            </td>
            <td>
              <div class="caption">canvasOutput</div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <script
      async
      src="https://docs.opencv.org/4.11.0/utils.js"
      type="text/javascript"
    ></script>
    <script src="main.js" type="text/javascript"></script>
    <script
      async
      src="opencv.js"
      type="text/javascript"
      onload="onOpenCvReady();"
      onerror="onOpenCvError();"
    ></script>
  </body>
  <style class="stylus">
    /* Insert code here... */
    #doc-content > div > div.contents {
      max-width: 960px;
      width: auto;
    }
  </style>
</html>
